server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      corsConfigurations:
        '[/**]':
          allowedOrigins: "*"
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventory/**

        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/wishlist/**, /api/v1/coupons/**

        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/payments/**

        - id: seller-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/sellers/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/notifications/**

        - id: admin-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/admin/**
