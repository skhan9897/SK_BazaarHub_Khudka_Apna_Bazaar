name: SK BazaarHub CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application
        run: |
          cd web
          npm install
          npm run build

      - name: Set up Android SDK & Build APK
        uses: android-actions/setup-android@v3
      - name: Build Android App
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
